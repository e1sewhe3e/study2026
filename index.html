const pk=[
["뇌우에서 지표면의 공기가 상승하는 원인은 무엇인가?",["태양 복사열이 공기를 가열하여 상승하게 한다.","더 따뜻한 공기 흐름이 유입되어 기존의 공기를 가열한다.","차갑고 습한 공기가 더 따뜻한 지표면 위로 이동하면서 가열된다.","상층의 공기가 냉각되어 하강하면서 지표면의 공기를 위로 밀어 올린다."]],
["수증기가 응결하면 어떤 일이 일어나는가?",["수증기가 공기에 의해 가열되어 더욱 상승한다.","물이 즉시 지표면으로 떨어진다.","수증기에 전하가 축적된다.","수증기가 물방울로 응결되어 구름을 형성한다."]],
["빗방울과 작은 얼음 알갱이(빙정, 氷晶)가 구름 속을 통과하며 떨어질 때 어떤 일이 일어나는가?",["빗방울과 빙정이 번개가 지나가는 통로를 만든다.","빗방울과 빙정이 서로 마찰하면서 전하가 발생한다.","빗방울과 빙정이 사라져 생긴 빈 공간을 메우기 위해 상승기류가 형성된다.","빗방울과 빙정이 구름 속 공기의 일부를 아래로 끌어내려 하강기류 만든다."]],
["번개가 치기 전에 구름의 아래쪽에는 무엇이 축적되는가?",["양(+)전하가 축적된다.","음(-)전하가 축적된다.","양(+)전하와 음(-)전하가 함께 축적된다.","양(+)전하와 음(-)전하가 빠르게 변화하며 섞여 있다."]],
["두 전기가 통하는 길(선도)에는 어떤 일이 일어나는가?",["첫 번째 선도가 구름에 도달한 후, 두 번째 선도가 지면에서 출발하여 다시 지면에 도달한다.","두 선도가 서로를 지나쳐 동시에 이동한다.","두 선도가 공중에서 서로 만난다.","첫 번째 선도가 지면에 도달한 후, 두 번째 선도가 지면에서 출발하여 구름에 도달한다."]]
];

"이번 영상에서 다룬 주제는 매우 복잡했다.","이번 영상에서 다룬 현상 및 원리(메커니즘)는 내가 느끼기에 매우 복잡했다.","이번 영상에서 다룬 개념과 정의들은 내가 느끼기에 매우 복잡했다.","영상 속 설명은 매우 불명확했다.","영상 속 설명은 학습 측면에서 매우 비효과적이었다.","영상 속 설명은 불명확한 표현으로 가득했다.","이번 영상은 다룬 주제에 대한 나의 이해를 크게 향상시켰다.","이번 영상은 과학적 현상에 대한 나의 지식과 이해를 크게 향상시켰다.","이번 영상은 다룬 현상 및 원리(메커니즘)에 대한 나의 이해를 크게 향상시켰다.","이번 영상은 개념과 정의에 대한 나의 이해를 크게 향상시켰다."];
const steps=[["guide","연구 설명서",0],["consent","동의서",0],["intro","시작 안내",0],["videoA","번개의 형성 영상",0],["checkA","음성 조작점검",60],["loadA","설문",180],["priorA","Prior Knowledge Test",180],["videoB","꿀벌의 춤 영상",0],["checkB","음성 조작점검",60],["loadB","설문",180],["bee","꿀벌의 춤 테스트 문항",0],["done","미리보기 종료",0]];
const DEBUG=new URLSearchParams(location.search).has('debug');
let idx=0,cond=null,answers={},timer=null,left=0;
function save(){document.querySelectorAll('input:checked').forEach(x=>answers[x.name]=x.value)}
function move(n){if(timer){clearInterval(timer);timer=null}save();idx=n;render()}
function buttons(label="다음 단계"){return `<div class="row"><span class="muted">선택한 응답은 단계 이동 시 임시 저장됩니다.</span><button class="btn primary" onclick="move(${idx+1})">${label} →</button></div>`}
function timerHtml(sec){return sec?`<div class="timer" id="timer">남은 시간 ${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}</div>`:""}
function beginTimer(sec){left=sec;tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);timer=null;move(idx+1)}},1000)}
function tick(){let e=document.getElementById("timer");if(e){e.textContent=`남은 시간 ${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;e.classList.toggle("urgent",left<=15)}}
function render(){
 const [key,label,duration]=steps[idx];document.getElementById("stepName").textContent=label;document.getElementById("stepNum").textContent=`${idx+1} / ${steps.length}`;document.getElementById("bar").style.width=(idx/(steps.length-1)*100)+"%";
 let h="";
 if(key==="guide"){
 h=`<div class="eyebrow">연구 참여 안내</div><h1>연구참여설명서</h1><p>본 연구에 참여하기 전에 아래 내용을 읽어 주세요. 각 항목의 제목을 누르면 자세한 내용을 확인할 수 있습니다.</p>
 <div class="info-grid">
 <div class="info-tile"><b>약 40분</b><span>온라인 1회 참여</span></div>
 <div class="info-tile"><b>자발적 참여</b><span>언제든 중단 가능</span></div>
 <div class="info-tile"><b>답례품 증정</b><span>전 과정 완료 및 유효한 응답 확인 후 지급</span></div>
 <div class="info-tile"><b>익명 처리</b><span>개인 식별 정보 비공개</span></div></div>
 <details><summary>1. 연구 목적</summary><div class="detail-body"><p>본 연구는 AI 기술로 제작된 교육 영상을 통해 학습할 때, 학습자의 이해와 학습 경험이 어떠한지 알아보고자 합니다. 연구 결과는 AI 기반 교육 콘텐츠를 설계하는 데 필요한 기초자료로 활용됩니다.</p></div></details>
 <details><summary>2. 참여 대상</summary><div class="detail-body"><p>4년제 대학에 재학 중이며 한국어를 능숙하게 구사하는 만 19세 이상 대학생이면 참여할 수 있습니다. 교육 영상을 시청하고 온라인 문항에 응답할 수 있는 기본적인 디지털 기기 활용 능력이 필요합니다.</p></div></details>
 <details><summary>3. 진행 절차</summary><div class="detail-body"><ol><li>연구 설명서를 확인하고 동의합니다.</li><li>사전 지식 확인: 두 학습 주제에 관한 기초 지식 객관식 문항</li><li>첫 번째 주제 학습 영상 시청 → 설문 → 학습 확인 문항(객관식·서술형)</li><li>휴식</li><li>두 번째 주제도 3단계와 같은 순서로 진행합니다.</li><li>연구 종료 후 답례품 수령을 위한 연락처를 입력합니다.</li></ol><p><b>유의사항</b><br>전 과정은 PC나 노트북으로 한 번에 진행해 주세요. 영상 시청을 위해 소리를 들을 수 있는 환경이 필요합니다.</p></div></details>
 <details><summary>4. 위험과 이익</summary><div class="detail-body"><p><b>위험</b><br>신체적 위험은 거의 없습니다. 영상을 보고 문항에 응답하는 동안 일시적인 피로감이나 집중력 저하, 서술형 문항 작성에 대한 부담을 느낄 수 있습니다. 이를 줄이기 위해 두 주제 사이에 휴식 시간을 드립니다.</p><p><b>이익</b><br>참여자에게 직접적인 이익은 없습니다. 다만 AI 기반 학습을 경험하고 자신의 학습 과정을 돌아볼 기회가 될 수 있습니다.</p></div></details>
 <details><summary>5. 답례품과 참여 철회</summary><div class="detail-body"><p>연구를 끝까지 완료하시고 <b>유효한 응답을 제출하신 분</b>께 소정의 답례품을 드립니다. 도중에 중단하면 답례품은 제공되지 않으며 그때까지의 자료는 분석에 사용하지 않고 폐기합니다. 불성실한 응답으로 판단되는 경우 자료가 분석에서 제외될 수 있습니다.</p><p>참여는 전적으로 자발적이며, 동의한 후에도 이유 없이 언제든 중단하거나 철회할 수 있고 어떤 불이익도 없습니다. 완료 후 철회하는 경우에도 자료는 삭제되며, 받은 답례품은 반환하지 않아도 됩니다.</p></div></details>
 <details><summary>6. 개인정보 보호와 자료 보관</summary><div class="detail-body"><p>성별, 연령, 학년과 답례품 발송용 이메일 또는 휴대폰 번호를 수집합니다. 연락처는 답례품 지급 후 즉시 폐기합니다.</p><p>응답 자료는 무작위 참여번호로 익명화하여 분석하며, 결과는 통계적으로 처리되어 개인이 식별되지 않는 형태로만 발표됩니다. 자료는 제3자에게 제공하거나 다른 목적으로 사용하지 않고, 연구진 외에는 열람할 수 없습니다. 다만 기관생명윤리위원회와 정부 관련 부처가 규정 범위 안에서 열람할 수 있습니다.</p><p>자료는 암호화하여 연구책임자만 접근할 수 있는 컴퓨터에 보관하며, 연구 종료 후 3년 뒤 폐기합니다.</p></div></details>
 <details><summary>7. 문의</summary><div class="detail-body"><p>연구책임자: 노아걸<br>전화: 010-2329-2882<br>이메일: luyajie@hanyang.ac.kr</p></div></details>
 <p class="smallnote">이 설명서는 참여 전 안내를 위한 것입니다.</p>
 <div class="row"><span class="muted">내용을 확인한 뒤 동의서로 이동해 주세요.</span><button class="btn primary" onclick="move(1)">동의서로 이동 →</button></div>`;
 }

 <label class="consent-item"><input type="checkbox" class="consent-check"><span>자발적으로 연구에 참여하며, 언제든 철회할 수 있음을 알고 있습니다.</span></label>
 <label class="consent-item"><input type="checkbox" class="consent-check"><span>개인정보 수집 및 이용에 동의합니다.</span></label>
