<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#202b39;--muted:#697586;--line:#e2e8f0;--blue:#365c8d;--pale:#edf3fa}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.top,main{max-width:780px;margin:auto;padding:18px 20px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:13px;letter-spacing:.04em}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px}main{padding-top:28px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:5px;background:#e2e8f0;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar{height:100%;background:var(--blue);width:0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 25px #253b5510}.eyebrow{font-size:12px;color:var(--blue);font-weight:750;letter-spacing:.06em;margin-bottom:8px}h1{font-size:clamp(23px,4vw,30px);line-height:1.3;margin:0 0 12px;letter-spacing:-.025em}p{margin:8px 0 16px;color:#4b5868}.muted{font-size:13px;color:var(--muted)}.video{aspect-ratio:16/9;background:#eef2f7;border:1px dashed #bac6d5;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#667386;margin:20px 0}.play{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;margin-bottom:12px;font-size:20px}.video strong{color:#2c3e52}.notice{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin:16px 0}.question{padding:18px 0;border-bottom:1px solid var(--line)}.question:last-of-type{border-bottom:0}.q{font-weight:650;color:var(--ink);margin:0 0 12px}.options{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.opt:has(input:checked){background:var(--pale);border-color:var(--blue)}input{accent-color:var(--blue)}input[type=radio]{margin-top:5px}.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.scale label{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:8px 0;font-size:12px;cursor:pointer}.scale label:has(input:checked){background:var(--pale);border-color:var(--blue);font-weight:750}.scale input{margin:0}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.timer{white-space:nowrap;background:#f0f4f8;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}.timer.urgent{background:#fff0e5;color:#99551b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.btn{border:0;border-radius:10px;padding:12px 17px;font-size:14px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#edf1f6;color:#334155}.pill{border:1px solid var(--line);border-radius:20px;padding:7px 11px;font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.summary div{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfd}.summary span{display:block;color:var(--muted);font-size:12px}.summary strong{font-size:20px}footer{text-align:center;color:#8a94a3;font-size:12px;padding:24px}@media(max-width:520px){.top{padding:14px 16px}main{padding:18px 12px 35px}.card{border-radius:14px}.scale{gap:2px}.scale label{font-size:10px}.row{align-items:stretch}.btn{padding:11px 12px}.summary{grid-template-columns:1fr}}

.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 24px}
.info-tile{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafbfd;min-width:0}
.info-tile b{display:block;font-size:14px;margin-bottom:3px}.info-tile span{font-size:12px;color:var(--muted);line-height:1.45;display:block}
details{border:1px solid var(--line);border-radius:11px;margin:9px 0;background:#fff;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:14px 15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:18px;color:var(--muted);font-weight:400}details[open] summary:after{content:"−"}
.detail-body{padding:0 15px 15px;color:#4b5868;font-size:14px}.detail-body p{font-size:14px;margin:7px 0 12px}.detail-body ol{padding-left:22px;margin:8px 0 12px}.detail-body li{padding:3px 0}
.consent-list{display:grid;gap:12px;margin:22px 0}.consent-item{display:flex;gap:11px;align-items:flex-start;padding:15px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.consent-item:has(input:checked){border-color:var(--blue);background:var(--pale)}.consent-item input{margin-top:5px;flex:0 0 auto;width:17px;height:17px}
.smallnote{font-size:12px;color:#8a94a3;line-height:1.5;margin-top:24px}
@media(max-width:520px){.info-grid{gap:8px}.info-tile{padding:11px}.info-tile b{font-size:13px}.detail-body,.detail-body p{font-size:13px}summary{padding:13px}}
.field{margin:16px 0}.field>b{display:block;margin-bottom:8px;font-size:14px}.field input[type=number],.field input[type=text],.field input[type=tel],.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;line-height:1.7;resize:vertical;background:#fff;color:var(--ink)}
.warn{background:#fff8e6;border:1px solid #f1d9a0;color:#7a5200;font-size:13.5px;line-height:1.6;padding:10px 14px}.warn b{font-weight:700}
.vwrap{position:relative;background:#000;border-radius:12px;overflow:hidden;margin:14px 0}.vwrap video{width:100%;display:block;max-height:70vh}.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;background:rgba(0,0,0,.6)}
.savebox{text-align:center;background:#fff8e6;border:2px solid #f1b84b;border-radius:14px;padding:32px 20px;margin-top:30px}.savebox h1{font-size:24px}.savebox p{font-size:17px;color:#7a5200;line-height:1.7}.spin{width:44px;height:44px;border:5px solid #f1d9a0;border-top-color:#e8891a;border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.okbox{background:#e7f6ec;border:2px solid #4caf73;color:#1b6b3a;border-radius:12px;padding:14px 16px;font-weight:700;margin-bottom:16px}
</style></head><body>

const pkA=[["뇌우에서 지표면의 공기가 상승하는 원인은 무엇인가?", ["태양 복사열이 공기를 가열하여 상승하게 한다.", "더 따뜻한 공기 흐름이 유입되어 기존의 공기를 가열한다.", "차갑고 습한 공기가 더 따뜻한 지표면 위로 이동하면서 가열된다.", "상층의 공기가 냉각되어 하강하면서 지표면의 공기를 위로 밀어 올린다."]], ["수증기가 응결하면 어떤 일이 일어나는가?", ["수증기가 공기에 의해 가열되어 더욱 상승한다.", "물이 즉시 지표면으로 떨어진다.", "수증기에 전하가 축적된다.", "수증기가 물방울로 응결되어 구름을 형성한다."]], ["빗방울과 작은 얼음 알갱이(빙정, 氷晶)가 구름 속을 통과하며 떨어질 때 어떤 일이 일어나는가?", ["빗방울과 빙정이 번개가 지나가는 통로를 만든다.", "빗방울과 빙정이 서로 마찰하면서 전하가 발생한다.", "빗방울과 빙정이 사라져 생긴 빈 공간을 메우기 위해 상승기류가 형성된다.", "빗방울과 빙정이 구름 속 공기의 일부를 아래로 끌어내려 하강기류 만든다."]], ["번개가 치기 전에 구름의 아래쪽에는 무엇이 축적되는가?", ["양(+)전하가 축적된다.", "음(-)전하가 축적된다.", "양(+)전하와 음(-)전하가 함께 축적된다.", "양(+)전하와 음(-)전하가 빠르게 변화하며 섞여 있다."]], ["두 전기가 통하는 길(선도) 에는 어떤 일이 일어나는가?", ["첫 번째 선도가 구름에 도달한 후, 두 번째 선도가 지면에서 출발하여 다시 지면에 도달한다.", "두 선도가 서로를 지나쳐 동시에 이동한다.", "두 선도가 공중에서 서로 만난다.", "첫 번째 선도가 지면에 도달한 후, 두 번째 선도가 지면에서 출발하여 구름에 도달한다."]]];
const pkB=[["꽃을 찾아다니는 꿀벌의 채집 행동에 대한 설명으로 가장 적절한 것은?", ["한 번 발견한 먹이를 기억하고 다시 찾아갈 수 있다.", "스스로 방향을 찾지 못하며, 타 개체의 페로몬 경로 따른다.", "공간 기억력이 없어, 매번 시각 자극에만 의존해 무작위로 탐색한다.", "에너지 소모를 줄이기 위해 먹이를 찾는 거리는 가능한 한 짧게 유지된다."]], ["동물들이 몸짓이나 행동으로 정보를 전달하는 방식에 대한 설명으로 가장 적절한 것은?", ["몸짓 신호는 소리나 화학 신호보다 항상 더 정확한 정보를 전달한다.", "곤충을 포함한 무척추동물에서도 관찰되지만, 포유류에 비해 정보의 복잡성은 제한적이다.", "일부 동물은 몸짓을 통해 다른 개체에게 유용한 정보를 전달할 수 있다.", "몸짓 신호는 대부분 선천적이나, 일부 종에서는 학습을 통해 정교화되기도 한다."]], ["페로몬은 사회성 곤충들 사이의 의사소통에 널리 사용된다. 다음 중 페로몬 신호만으로 전달하기에 가장 부적절한 정보는 무엇인가?", ["다른 개체가 알려 준 먹이 위치로 안내하는 이동 경로 표시", "근처 포식자의 존재를 알리는 경고 신호", "여왕벌의 생식 상태 및 번식 가능성 정보", "벌집에서 멀리 떨어진 먹이의 정확한 방향과 거리 정보"]], ["개미와 벌 같은 사회성 곤충이 많은 개체의 행동을 조정하는 방식에 대한 설명으로 가장 적절한 것은?", ["일부 개체가 다른 개체의 행동을 주도적으로 통제하여 집단의 행동을 조정한다.", "화학 신호나 접촉 같은 여러 신호를 이용해 행동이 조정된다.", "유전적으로 고정행동패턴을 반복한다.", "외부 환경과 무관하게 행동이 결정된다."]], ["꿀벌이 비행 중 방향을 설정할 때 주로 의존하는 것은 무엇인가?", ["비행 중 바람의 방향과 세기 변화를 이용하여 이동 방향을 조정한다.", "지구 자기장의 방향을 감지하여 현재 위치와 이동 방향을 판단한다.", "태양의 위치와 이동을 기준으로 비행 방향을 결정하고 이를 이동 경로에 활용한다.", "주변의 냄새 농도 차이를 감지하여 먹이원의 방향을 파악한다."]]];

 <details><summary>1. 연구 목적</summary><div class="detail-body"><p>본 연구는 AI 기술로 제작된 교육 영상을 통해 학습할 때, 학습자의 이해와 학습 경험이 어떠한지 알아보고자 합니다. 연구 결과는 AI 기반 교육 콘텐츠를 설계하는 데 필요한 기초자료로 활용됩니다.</p></div></details>
 <details><summary>2. 참여 대상</summary><div class="detail-body"><p>4년제 대학에 재학 중이며 한국어를 능숙하게 구사하는 만 19세 이상 대학생이면 참여할 수 있습니다. 교육 영상을 시청하고 온라인 문항에 응답할 수 있는 기본적인 디지털 기기 활용 능력이 필요합니다.</p></div></details>
 <details><summary>3. 진행 절차</summary><div class="detail-body"><ol><li>연구 설명서를 확인하고 동의합니다.</li><li>두 가지 학습 주제를 차례로 학습합니다. 각 주제마다 사전 지식 문항 → 학습 영상 시청 → 설문 → 학습 확인 문항(객관식·서술형) 순서로 진행합니다.</li><li>두 주제 사이에 약 5분의 휴식이 있습니다.</li><li>연구 종료 후 답례품 수령을 위한 연락처를 입력합니다.</li></ol><p><b>유의사항</b><br>전 과정은 PC나 노트북으로 한 번에 진행해 주세요. 영상 시청을 위해 소리를 들을 수 있는 환경이 필요합니다.</p></div></details>
 <details><summary>4. 위험과 이익</summary><div class="detail-body"><p><b>위험</b><br>신체적 위험은 거의 없습니다. 영상을 보고 문항에 응답하는 동안 일시적인 피로감이나 집중력 저하, 서술형 문항 작성에 대한 부담을 느낄 수 있습니다. 이를 줄이기 위해 두 주제 사이에 휴식 시간을 드립니다.</p><p><b>이익</b><br>참여자에게 직접적인 이익은 없습니다. 다만 AI 기반 학습을 경험하고 자신의 학습 과정을 돌아볼 기회가 될 수 있습니다.</p></div></details>
 <details><summary>5. 답례품과 참여 철회</summary><div class="detail-body"><p>연구를 끝까지 완료하시고 <b>유효한 응답을 제출하신 분</b>께 소정의 답례품을 드립니다. 도중에 중단하면 답례품은 제공되지 않으며 그때까지의 자료는 분석에 사용하지 않고 폐기합니다. 불성실한 응답으로 판단되는 경우 자료가 분석에서 제외될 수 있습니다.</p><p>참여는 전적으로 자발적이며, 동의한 후에도 이유 없이 언제든 중단하거나 철회할 수 있고 어떤 불이익도 없습니다. 완료 후 철회하는 경우에도 자료는 삭제되며, 받은 답례품은 반환하지 않아도 됩니다.</p></div></details>
 <details><summary>6. 개인정보 보호와 자료 보관</summary><div class="detail-body"><p>성별, 연령, 학년과 답례품 발송용 휴대폰 번호를 수집합니다. 연락처는 답례품 지급 후 즉시 폐기합니다.</p><p>응답 자료는 무작위 참여번호로 익명화하여 분석하며, 결과는 통계적으로 처리되어 개인이 식별되지 않는 형태로만 발표됩니다. 자료는 제3자에게 제공하거나 다른 목적으로 사용하지 않고, 연구진 외에는 열람할 수 없습니다. 다만 기관생명윤리위원회와 정부 관련 부처가 규정 범위 안에서 열람할 수 있습니다.</p><p>자료는 암호화하여 연구책임자만 접근할 수 있는 컴퓨터에 보관하며, 연구 종료 후 3년 뒤 폐기합니다.</p></div></details>
